group 'com.jiguang.jpush'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        mavenCentral()
        google()
        jcenter()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:4.1.3'
    }
}

rootProject.allprojects {
    repositories {
        mavenCentral()
        google()
        jcenter()
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "com.jiguang.jpush"  // 必填，指定命名空间

    compileSdkVersion 34             // 升级到最新SDK版本，和你项目保持一致

    defaultConfig {
        minSdkVersion 19             // 建议最低19，官方推荐
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation ('cn.jiguang.sdk:jpush:5.7.2') {
        exclude group: 'cn.jiguang.sdk', module: 'jcore'  // 排除默认的 jcore
    }
    implementation 'cn.jiguang.sdk:jcore:5.2.1'          // 使用新版 jcore
}
