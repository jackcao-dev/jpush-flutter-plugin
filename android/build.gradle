plugins {
    id 'com.android.library'
}

android {
    namespace = "com.jiguang.jpush"
    compileSdk = 34

    defaultConfig {
        minSdk = 19
    }

    lint {
        disable 'InvalidPackage'
    }
}

repositories {
    google()
    mavenCentral()
    jcenter()
}

dependencies {
    implementation ('cn.jiguang.sdk:jpush:5.7.3') {
        exclude group: 'cn.jiguang.sdk', module: 'jcore'
    }
    implementation 'cn.jiguang.sdk:jcore:5.0.4'

    // 多厂商推送支持（注意版本统一为 5.7.3）
    implementation 'cn.jiguang.sdk.plugin:huawei:5.7.3'
    implementation 'com.huawei.hms:push:6.12.0.300'

    implementation 'cn.jiguang.sdk.plugin:xiaomi:5.7.3'
    implementation 'cn.jiguang.sdk.plugin:vivo:5.7.3'
    implementation 'cn.jiguang.sdk.plugin:oppo:5.7.3'
    implementation 'cn.jiguang.sdk.plugin:honor:5.7.3'
    implementation 'cn.jiguang.sdk.plugin:meizu:5.7.3'

    implementation 'commons-codec:commons-codec:1.18.0'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'androidx.annotation:annotation:1.9.0'
}

